[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-manager"
version = "0.1.0"
description = "Windows desktop foundation for Marketplace Manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.scripts]
marketplace-manager = "marketplace_manager.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --basetemp=.test-tmp"

[tool.setuptools.packages.find]
where = ["src"]
